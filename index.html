<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>حديقة السحر</title>
  <style>
    :root {
      --purple: #8A2BE2;
      --pink: #FF69B4;
      --gold: #FFD700;
      --heart: #ff3366;
      --text-primary: #f8f9fa;
      --text-secondary: #e2c4ff;
    }

    body {
      background: radial-gradient(circle at center, #2A0A45, #0E011F);
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      color: var(--text-primary);
    }

    .cosmic-dust {
      position: fixed;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="1" fill="white" opacity="0.7"/></svg>');
      animation: twinkle 5s infinite;
    }

    h1 {
      font-size: 4.5rem;
      background: linear-gradient(45deg, var(--purple), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin: 2rem 0;
      position: relative;
      text-shadow: 0 0 20px rgba(255,105,180,0.3);
    }

    .magic-text {
      font-size: 1.2rem;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.6;
      text-shadow: 0 0 15px rgba(255,255,255,0.3);
      margin: 1rem 0;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin: 2rem 0;
    }

    .magic-button {
      background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 50%, var(--gold) 100%);
      padding: 1.5rem 3rem;
      font-size: 1.4rem;
      border-radius: 30px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 4px 20px rgba(138,43,226,0.3), 0 0 30px rgba(255,215,0,0.2) inset;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      position: relative;
      overflow: hidden;
      transform-style: preserve-3d;
      -webkit-tap-highlight-color: transparent;
    }

    .magic-button span:first-child {
      position: relative;
      z-index: 2;
    }

    .magic-button span:last-child {
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.7));
      animation: iconFloat 2s ease-in-out infinite;
    }

    .real-magic-button {
      background: linear-gradient(135deg, var(--gold) 0%, var(--pink) 50%, var(--purple) 100%);
      animation: pulseGlow 2s infinite, rainbowBorder 4s infinite linear;
    }

    @keyframes rainbowBorder {
      0% { border-color: var(--gold); }
      33% { border-color: var(--pink); }
      66% { border-color: var(--purple); }
      100% { border-color: var(--gold); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(255,215,0,0.5); transform: scale(1); }
      50% { box-shadow: 0 0 30px rgba(255,215,0,0.8); transform: scale(1.05); }
    }

    .magic-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background: linear-gradient(90deg, transparent 25%, rgba(255,255,255,0.2) 50%, transparent 75%);
      animation: buttonShine 4s infinite;
    }

    @keyframes buttonShine {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .magic-button:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 30px rgba(138,43,226,0.5);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .grid-item {
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .grid-item p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      margin: 1rem 0;
      line-height: 1.8;
      text-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    /* تأثيرات القلوب والنجوم */
    .magic-orb {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #fff, var(--purple));
      border-radius: 50%;
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      animation: orbFloat 6s ease-in-out infinite;
    }

    .sparkle {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.9);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: sparkleTwinkle 2s infinite;
    }

    .floating-star {
      position: fixed;
      width: 15px;
      height: 15px;
      background: rgba(255,255,255,0.7);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      animation: floatStar 10s linear infinite;
    }

    .big-heart {
      position: fixed;
      top: 50%;
      left: 50%;
      font-size: 10rem;
      transform: translate(-50%, -50%);
      animation: popHeart 1.5s ease forwards;
      z-index: 1000;
    }

    @keyframes flyHeart {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-150vh) scale(1.5); opacity: 0; }
    }

    .flying-heart {
      position: fixed;
      font-size: 1.5rem;
      z-index: 999;
      animation: flyHeart 3s linear forwards;
      pointer-events: none;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      50% { transform: translateX(-50%) translateY(-20px) rotate(180deg); }
    }

    @keyframes sparkleTwinkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes floatStar {
      0% { transform: translateY(0) translateX(0); opacity: 0.7; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }

    @keyframes popHeart {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }

    /* تحسينات الجوال */
    @media (max-width: 768px) {
      h1 { font-size: 2.5rem; padding: 0 1rem; }
      .magic-button { padding: 1rem 1.5rem; font-size: 1.1rem; }
      .grid-container { padding: 1rem; grid-template-columns: 1fr; }
      .button-container { gap: 1rem; padding: 0 1rem; }
    }

    .magic-menu-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 1000;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--purple);
      border: 2px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(138,43,226,0.5);
      display: none;
    }

    .mobile-menu {
      position: fixed;
      bottom: -200px;
      left: 0;
      right: 0;
      background: rgba(42,10,69,0.95);
      padding: 1rem;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
    }

    .mobile-menu.show { bottom: 0; }

    .mobile-menu a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 1rem;
      margin: 0.5rem 0;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .mobile-menu a:hover { background: rgba(255,255,255,0.1); }

    .scroll-top-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--pink);
      color: white;
      border: none;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 0 10px rgba(255,105,180,0.5);
    }

    .scroll-top-btn.show { opacity: 1; }

    @media (max-width: 768px) {
      .magic-menu-btn { display: block; }
    }
  </style>
</head>
<body>
  <div class="cosmic-dust"></div>
  <button class="magic-menu-btn">☰</button>
  <div class="mobile-menu">
    <a href="/">الرئيسية</a>
    <a href="/gallery">المعرض</a>
    <a href="/contact">اتصل بنا</a>
  </div>
  <button class="scroll-top-btn">↑</button>

  <header>
    <h1>حديقة السحر</h1>
    <p class="magic-text">رسمة حب تزهر بين يديك</p>
  </header>

  <main>
    <div class="button-container">

      <a href="/welcome" class="magic-button">
        <span>استكشف السحر</span>
        <span>✨</span>
      </a>
      <a href="/flower" class="magic-button">
        <span>باقة ورد</span>
        <span>🌹</span>
      </a>
      <a href="/co" class="magic-button real-magic-button">
        <span>السحر الحقيقي</span>
        <span>🪄</span>
      </a>
      <a href="/drow" class="magic-button draw-button">
        <span>رسم وردة</span>
        <span>🎨</span>
      </a>

      <a href="/lib" class="magic-button real-magic-button">
        <span>اصنع السحر</span>
        <span>🌟</span>
    <a href="/story" class="magic-button real-magic-button">
        <span>قصه</span>
        <span>🌟</span>
      <a href="/cong" class="magic-button draw-button">
        <span>مباركات قديمه</span>
      </a>
      <a href="/pint" class="magic-button draw-button">
        <span>رسم</span>
        <span>🎨</span>
      </a>

    </div>


    <div class="grid-container">
      <div class="grid-item">
        <div class="floral-border"></div>
        <p class="magic-text">إبداعك ينساب كالأنهار</p>
      </div>
      <div class="grid-item">
        <div class="floral-border"></div>
        <p class="magic-text">كل لمسة فرشاة تغني قصة</p>
      </div>
      <div class="grid-item">
        <div class="floral-border"></div>
        <p class="magic-text">ارسم عالمك السحري هنا</p>
      </div>
    </div>

    <div class="grid-container">
      <div class="grid-item">
        <div class="magic-orb"></div>
        <p style="margin-top:20px; color:white;">لمسة سحرية في كل تفصيل</p>
      </div>
      <div class="grid-item">
        <div class="sparkle" style="width:30px; height:30px; top:20px; left:40px;"></div>
        <div class="sparkle" style="width:20px; height:20px; top:60px; right:30px; animation-delay:-0.5s;"></div>
        <p style="margin-top:20px; color:white;">ذكريات تتلألأ كالنجوم</p>
      </div>
      <div class="grid-item">
        <div class="magic-orb"></div>
        <div class="sparkle" style="width:30px; height:30px; top:20px; left:40px;"></div>
        <div class="sparkle" style="width:20px; height:20px; top:60px; right:30px; animation-delay:-0.5s;"></div>
        <p style="margin-top:20px; color:white;">نثر القلوب في سماء الإبداع</p>
      </div>

    </div>
  </main>


  <script>
    function showHearts() {
      const bigHeart = document.createElement("div");
      bigHeart.className = "big-heart";
      bigHeart.innerText = "💜";
      document.body.appendChild(bigHeart);
      setTimeout(() => bigHeart.remove(), 1500);

      const colors = ["❤️", "💛", "💚", "💙", "💜", "🧡", "🤍"];
      for (let i = 0; i < 20; i++) {
        const heart = document.createElement("div");
        heart.className = "flying-heart";
        heart.innerText = colors[Math.floor(Math.random() * colors.length)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "100vh";
        heart.style.fontSize = (Math.random() * 1.5 + 1) + "rem";
        heart.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
      }
    }

    // تفعيل زر التمرير للأعلى
    window.addEventListener('scroll', () => {
      const btn = document.querySelector('.scroll-top-btn');
      btn.classList.toggle('show', window.scrollY > 500);
    });

    document.querySelector('.scroll-top-btn').addEventListener('click', () => {
      window.scrollTo({top: 0, behavior: 'smooth'});
    });

    // تفعيل القائمة الجانبية
    document.querySelector('.magic-menu-btn').addEventListener('click', () => {
      document.querySelector('.mobile-menu').classList.toggle('show');
    });

    // تأثيرات اللمس
    document.addEventListener('touchstart', function(e) {
      const touch = e.touches[0];
      const ripple = document.createElement('div');
      ripple.style.left = touch.clientX + 'px';
      ripple.style.top = touch.clientY + 'px';
      ripple.className = 'magic-ripple';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1000);
    });
  </script>
</body>
</html>
