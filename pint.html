<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تلوين ممتع 🎨</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3e8ff; }
        canvas { touch-action: none; }
        .tool-btn { min-width: 90px; }
        @media (max-width: 640px) {
            .canvas-container { width: 300px !important; height: 300px !important; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 text-gray-800">

    <h1 class="text-2xl md:text-3xl font-bold mb-4 text-violet-600 text-center">🎨 صفحة تلوين ممتعة</h1>

    <div class="mb-4 w-full max-w-xs md:max-w-sm">
        <label class="block mb-2 text-base md:text-lg font-semibold text-violet-700">اختر صورة للتلوين</label>
        <select id="imageSelector" class="w-full p-2 rounded border border-violet-400 focus:ring focus:ring-violet-300 text-sm md:text-base">
            <option disabled selected>اختر صورة...</option>
            <option value="https://cdn.pixabay.com/photo/2021/03/25/11/44/easter-6122827_1280.png">بيضة مزخرفة 🥚</option>
            <option value="https://cdn.pixabay.com/photo/2025/03/01/16/56/easter-9440439_1280.png">أرنب 🐰</option>
            <option value="https://cdn.pixabay.com/photo/2022/06/30/08/46/flower-7293203_1280.png">زهرة 🌸</option>
            <option value="https://cdn.pixabay.com/photo/2024/09/23/19/26/ai-generated-9069839_1280.png">فراشة 🦋</option>
        </select>
    </div>

    <div class="flex flex-wrap gap-2 mb-4 justify-center">
        <input type="color" id="colorPicker" value="#8b5cf6" class="w-10 h-10 md:w-12 md:h-12 p-1 border rounded-full border-violet-400">
        <div class="flex items-center gap-2 bg-violet-100 px-2 rounded">
            <input type="range" id="brushSize" min="1" max="30" value="5" class="w-24" oninput="updateBrushSize(this.value)">
            <span id="brushSizeValue" class="text-violet-700 text-sm">5</span>
        </div>
        <button onclick="toggleEraser()" id="eraserBtn" class="tool-btn bg-violet-400 text-white px-3 py-1 rounded hover:bg-violet-500 text-sm">ممحاة</button>
        <button onclick="togglePan()" id="panBtn" class="tool-btn bg-violet-400 text-white px-3 py-1 rounded hover:bg-violet-500 text-sm">تحريك</button>
        <button onclick="undo()" id="undoBtn" class="tool-btn bg-gray-400 text-white px-3 py-1 rounded hover:bg-gray-500 text-sm" disabled>تراجع</button>
        <button onclick="redo()" id="redoBtn" class="tool-btn bg-gray-400 text-white px-3 py-1 rounded hover:bg-gray-500 text-sm" disabled>إعادة</button>
        <button onclick="clearCanvas()" class="tool-btn bg-gray-400 text-white px-3 py-1 rounded hover:bg-gray-500 text-sm">مسح الكل</button>
        <button onclick="downloadImage()" class="tool-btn bg-green-400 text-white px-3 py-1 rounded hover:bg-green-500 text-sm">حفظ</button>
    </div>

    <div class="border-4 border-violet-400 rounded-lg overflow-hidden shadow-lg mx-2 canvas-container" style="width: 350px; height: 350px;">
        <canvas id="drawingCanvas" width="800" height="800"></canvas>
    </div>

    <div class="flex gap-2 mt-4">
        <button onclick="zoomCanvas(1.2)" class="bg-violet-500 text-white px-4 py-1 rounded hover:bg-violet-600 text-xl">+</button>
        <button onclick="zoomCanvas(0.8)" class="bg-violet-500 text-white px-4 py-1 rounded hover:bg-violet-600 text-xl">−</button>
        <button onclick="resetZoom()" class="bg-violet-300 text-white px-3 py-1 rounded hover:bg-violet-400 text-sm">إعادة</button>
    </div>

    <script>
        const canvas = new fabric.Canvas('drawingCanvas', {
            isDrawingMode: true,
            allowTouchScrolling: false
        });

        let isPanning = false;
        let currentImageUrl = null;
        let zoomLevel = 1;
        let undoStack = [];
        let redoStack = [];
        const MAX_STACK_SIZE = 20;

        // تهيئة الفرشاة
        canvas.freeDrawingBrush.color = document.getElementById('colorPicker').value;
        canvas.freeDrawingBrush.width = 5;

        function updateBrushSize(size) {
            canvas.freeDrawingBrush.width = parseInt(size);
            document.getElementById('brushSizeValue').textContent = size;
        }

        function saveState() {
            if (undoStack.length >= MAX_STACK_SIZE) undoStack.shift();
            undoStack.push(JSON.stringify(canvas.toJSON()));
            redoStack = [];
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
        }

        function undo() {
            if (undoStack.length > 0) {
                redoStack.push(JSON.stringify(canvas.toJSON()));
                const state = undoStack.pop();
                canvas.loadFromJSON(JSON.parse(state), () => canvas.renderAll());
                updateUndoRedoButtons();
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                undoStack.push(JSON.stringify(canvas.toJSON()));
                const state = redoStack.pop();
                canvas.loadFromJSON(JSON.parse(state), () => canvas.renderAll());
                updateUndoRedoButtons();
            }
        }

        document.getElementById('colorPicker').addEventListener('change', (e) => {
            canvas.freeDrawingBrush.color = e.target.value;
        });

        function toggleEraser() {
            if (canvas.freeDrawingBrush.color !== '#ffffff') {
                canvas.freeDrawingBrush.color = '#ffffff';
                document.getElementById('eraserBtn').innerText = 'رسم';
            } else {
                canvas.freeDrawingBrush.color = document.getElementById('colorPicker').value;
                document.getElementById('eraserBtn').innerText = 'ممحاة';
            }
        }

        function togglePan() {
            isPanning = !isPanning;
            canvas.isDrawingMode = !isPanning;
            document.getElementById('panBtn').innerText = isPanning ? 'رسم' : 'تحريك';
            document.getElementById('eraserBtn').innerText = 'ممحاة';
        }

        canvas.on('mouse:down', function(opt) {
            if (isPanning) {
                this.isDragging = true;
                this.selection = false;
                const e = opt.e;

                if (e.touches) {
                    e.preventDefault();
                    this.lastPosX = e.touches[0].clientX;
                    this.lastPosY = e.touches[0].clientY;
                } else {
                    this.lastPosX = e.clientX;
                    this.lastPosY = e.clientY;
                }
            }
        });

        canvas.on('mouse:move', function(opt) {
            if (this.isDragging && isPanning) {
                const e = opt.e;
                e.preventDefault();
                let clientX, clientY;

                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                const vpt = this.viewportTransform;
                vpt[4] += clientX - this.lastPosX;
                vpt[5] += clientY - this.lastPosY;
                this.requestRenderAll();
                this.lastPosX = clientX;
                this.lastPosY = clientY;
            }
        });

        canvas.on('mouse:up', function() {
            this.isDragging = false;
        });

        document.getElementById('imageSelector').addEventListener('change', function() {
            currentImageUrl = this.value;
            clearCanvas();
        });

        function clearCanvas() {
            canvas.clear();
            if (currentImageUrl) loadImage(currentImageUrl);
            saveState();
        }

        function loadImage(url) {
            fabric.Image.fromURL(url, function(img) {
                img.set({ selectable: false });
                const scaleFactor = Math.min(
                    canvas.width / img.width,
                    canvas.height / img.height
                );
                img.scale(scaleFactor);
                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
                saveState();
            });
        }

        function zoomCanvas(factor) {
            zoomLevel *= factor;
            canvas.setZoom(zoomLevel);
        }

        function resetZoom() {
            zoomLevel = 1;
            canvas.setZoom(1);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.href = canvas.toDataURL({format: 'png'});
            link.download = 'coloring.png';
            link.click();
        }

        canvas.on('path:created', () => saveState());
        window.addEventListener('resize', adjustCanvasSize);
        adjustCanvasSize();

        function adjustCanvasSize() {
            const currentZoom = zoomLevel;
            if (window.innerWidth < 640) {
                canvas.setDimensions({ width: 300, height: 300 });
            } else {
                canvas.setDimensions({ width: 350, height: 350 });
            }
            canvas.setZoom(currentZoom);
            canvas.renderAll();
        }
    </script>

</body>
</html>
