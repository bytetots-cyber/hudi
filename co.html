<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>هدهد المحبة</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap');

    :root {
      --main-purple: #6C3082;
      --accent-color: #C56CE6;
      --text-light: #f0e5f7;
      --gold: #FFD700;
    }

    body {
      margin: 0;
      font-family: 'Noto Naskh Arabic', sans-serif;
      background: linear-gradient(135deg, #4A1E5C, #6C3082);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 1rem;
      position: relative;
      overflow: hidden;
      touch-action: manipulation;
    }

    .magic-dust {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(circle at 50% 50%,
          rgba(255,255,255,0.1) 0%,
          transparent 70%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 3px,
          rgba(255,255,255,0.05) 3px,
          rgba(255,255,255,0.05) 6px
        );
      animation: glow 4s ease-in-out infinite;
      z-index: 0;
    }

    .hudhud-container {
      position: relative;
      margin: 2rem;
      z-index: 2;
    }

    .hudhud {
      font-size: clamp(6rem, 20vw, 10rem);
      animation:
        fly 3s ease-in-out infinite,
        pulse 2s ease-in-out infinite;
      filter: drop-shadow(0 0 25px rgba(197, 108, 230, 0.7));
      transform-origin: center;
    }

    .hudhud-wing {
      position: absolute;
      font-size: 2.5rem;
      animation: wingFlap 0.8s ease-in-out infinite;
      opacity: 0.8;
    }

    @keyframes fly {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(5deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes wingFlap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-20deg); }
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      margin: 1.5rem;
      text-shadow: 0 0 25px var(--accent-color);
      line-height: 1.4;
      padding: 1rem 2rem;
      background: linear-gradient(45deg,
        rgba(255,255,255,0.1),
        rgba(255,255,255,0.2));
      border-radius: 50px;
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.3);
      position: relative;
      z-index: 2;
      transition: transform 0.3s ease;
    }

    h1:hover {
      transform: scale(1.02);
    }

    p {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      color: var(--text-light);
      max-width: 800px;
      line-height: 1.8;
      margin: 1rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 2;
      transition: all 0.3s ease;
    }

    p:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
    }

    .controls {
      position: fixed;
      bottom: 20px;
      right: 50%;
      transform: translateX(50%);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 3;
    }

    .control-btn {
      background: linear-gradient(45deg,
        rgba(255,255,255,0.15),
        rgba(255,255,255,0.25));
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 0.8em 1.5em;
      border-radius: 50px;
      font-size: clamp(0.9rem, 4vw, 1.2rem);
      backdrop-filter: blur(15px);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow:
        0 4px 15px rgba(0,0,0,0.2),
        0 0 10px rgba(197, 108, 230, 0.3);
      flex-direction: row-reverse;
    }

    .control-btn span:first-child {
      margin-left: 0.3em;
    }
    .control-btn:hover {
      background: linear-gradient(45deg,
        rgba(255,255,255,0.25),
        rgba(255,255,255,0.35));
      transform: translateY(-2px) scale(1.05);
      box-shadow:
        0 6px 20px rgba(0,0,0,0.3),
        0 0 15px rgba(197, 108, 230, 0.5);
    }

    /* الصفحة السرية */
    .secret-page {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #2A0A45, #0E011F);
      z-index: 1000;
    }

    .secret-content {
      position: relative;
      padding: 2rem;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .secret-bird {
      font-size: 8rem;
      filter: drop-shadow(0 0 25px rgba(255,215,0,0.5));
      animation:
        headFloat 3s ease-in-out infinite,
        mysticGlow 2s infinite;
      margin-bottom: 2rem;
    }

    .secret-title {
      font-size: 3.5rem;
      color: #FFD700;
      text-shadow: 0 0 30px rgba(255,215,0,0.7);
      background: linear-gradient(45deg, #FFD700, #FF69B4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 1rem 0;
    }

    .soon-text {
      font-size: 2.5rem;
      color: #C56CE6;
      animation:
        pulse 1.5s ease-in-out infinite,
        mysticGlow 2s infinite alternate;
      border: 2px solid #FF69B4;
      padding: 1rem 2rem;
      border-radius: 50px;
      margin: 1rem 0;
    }

    .secret-message {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 2rem;
    }

    .secret-message span {
      font-size: 1.5rem;
      padding: 0.8rem 1.5rem;
      background: rgba(255,255,255,0.1);
      border-radius: 30px;
      animation: fadeIn 1s ease-in-out;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    /* الأنيميشنات */
    @keyframes mysticGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    @keyframes headFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .feather-fall {
      position: absolute;
      font-size: 1.5rem;
      animation: featherFall 8s linear infinite;
      opacity: 0.5;
      filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
    }

    @keyframes featherFall {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 0.5;
      }
      100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes sparkleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-50px); }
    }

    @keyframes fade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0.8; }
    }

    @media (max-width: 768px) {
      h1 { padding: 0.8rem 1.5rem; }
      p { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="magic-dust"></div>

  <!-- ريش متساقط -->
  <div class="feather-fall" style="left: 10%; animation-delay: -2s">🪶</div>
  <div class="feather-fall" style="left: 30%; animation-delay: -4s">🪶</div>
  <div class="feather-fall" style="left: 70%; animation-delay: -1s">🪶</div>
  <div class="feather-fall" style="left: 90%; animation-delay: -3s">🪶</div>

  <div class="hudhud-container">
    <div class="hudhud-wing" style="top: -20px; right: -30px;">🪽</div>
    <div class="hudhud">🕊️</div>
    <div class="hudhud-wing" style="top: -20px; left: -30px;">🪽</div>
  </div>

  <h1>هدهد المحبة</h1>

  <p>
    قريبًا سنرى السحر الحقيقي... 🪄✨
  </p>

  <!-- الصفحة السرية -->
  <div class="secret-page">
    <div class="secret-content">
      <div class="secret-bird">🐦</div>
      <h2 class="secret-title">السحر الحقيقي</h2>
      <div class="soon-text">قريبًا...</div>
      <div class="secret-message">
        <span>🪄 التحضيرات جارية</span>
        <span>✨ أسرار تتبلور</span>
        <span>💖 مفاجآت في الطريق</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" onclick="history.back()">
      <span>◀</span>
      <span>رجوع</span>
    </button>
  </div>

  <script>
    document.addEventListener("click", (e) => {
      createFeather(e.pageX, e.pageY);
      createSparkles(e.pageX, e.pageY);
    });

    function createFeather(x, y) {
      const feather = document.createElement("div");
      feather.textContent = "🪶";
      feather.style.cssText = `
        position: absolute;
        left: ${x}px;
        top: ${y}px;
        font-size: ${Math.random() * 2 + 1.5}rem;
        pointer-events: none;
        opacity: 1;
        animation:
          featherFloat ${Math.random() * 2 + 1.5}s ease-out,
          spin ${Math.random() * 3 + 2}s linear infinite;
      `;
      document.body.appendChild(feather);
      setTimeout(() => feather.remove(), 2000);
    }

    function createSparkles(x, y) {
      for (let i = 0; i < 5; i++) {
        const sparkle = document.createElement("div");
        sparkle.textContent = "✨";
        sparkle.style.cssText = `
          position: absolute;
          left: ${x + Math.random() * 30 - 15}px;
          top: ${y + Math.random() * 30 - 15}px;
          font-size: ${Math.random() * 1 + 1}rem;
          pointer-events: none;
          animation:
            sparkleFloat ${Math.random() * 1 + 0.5}s ease-out,
            fade ${Math.random() * 1 + 0.5}s ease-out;
        `;
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 1000);
      }
    }

    // تفعيل الصفحة السرية بالضغط المزدوج
    document.addEventListener('dblclick', (e) => {
      const secretPage = document.querySelector('.secret-page');
      if(secretPage.style.display === 'none') {
        secretPage.style.display = 'block';
        document.documentElement.style.overflow = 'hidden';
      } else {
        secretPage.style.display = 'none';
        document.documentElement.style.overflow = 'auto';
      }

      if(!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      }
    });

    document.querySelector('.hudhud').addEventListener('mouseover', () => {
      document.querySelector('.hudhud').style.animation = 'fly 1s ease-in-out infinite, pulse 0.5s ease-in-out infinite';
    });

    document.querySelector('.hudhud').addEventListener('mouseout', () => {
      document.querySelector('.hudhud').style.animation = 'fly 3s ease-in-out infinite, pulse 2s ease-in-out infinite';
    });
  </script>
</body>
</html>
