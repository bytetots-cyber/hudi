<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enchanted Love Meadow</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
        }

        canvas {
            display: block;
        }

        #audioControl {
            position: absolute;
            display: flex;
            flex-direction: column;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background-color: transparent;
            padding: 5px;
            border-radius: 5px;
        }

        #audioControl label {
            display: relative;
            align-items: center;
            text-align: center;
            text-decoration: 3px solid underline;
            line-height: 20px;
            padding: 4px;
            color: #333;
            margin: 5px;
            font-family: Arial, sans-serif;
            font-size: 1.5em;
        }

        audio {
            background-color: transparent;
            border: none;
            outline: none;
            width: 300px;
            height: 30px;
        }

        .love-text {
            position: absolute;
            color: #ff69b4;
            font-family: 'Dancing Script', 'Brush Script MT', cursive;
            font-size: 2.8em;
            text-shadow: 0 0 20px rgba(255,105,180,0.8);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            animation: floatLove 8s linear forwards;
            white-space: nowrap;
        }

        @keyframes floatLove {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.8);
            }
            20% {
                opacity: 1;
                transform: translateY(-20px) scale(1.1);
            }
            80% {
                opacity: 1;
                transform: translateY(-100px) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.5);
            }
        }
    </style>
</head>

<body>
    <div id="audioControl">
        <label for="springSong">♬ Our Song ♬</label>
        <audio id="springSong" controls loop autoplay controlslist="nodownload noplaybackrate">
            <source src="https://www.dropbox.com/scl/fi/ojzof33cgtjya0gjdvyxa/butterfly.mp3?rlkey=vg9nf2p3hpiqknrvi8ax2jlik&st=w9mf6i9i&dl=1" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, controls;
        const butterflies = [];
        const flowers = [];
        let particles;
        const clock = new THREE.Clock();
        let composer;
        const loveMessages = [
            "Your Eyes Sparkle ✨",
            "My Heart Beats for You 💖",
            "Forever & Always 🌸",
            "Soul Connected 🌹",
            "Eternal Love Story 🌼",
            "Butterflies in My Heart 🦋"
        ];

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x87CEEB, 50, 150);
            scene.background = new THREE.Color(0x87CEEB);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 40);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Setup scene elements
            setupScene();

            // Create floating text messages
            setInterval(createLoveText, 5000);
            createLoveText();

            // Start animation loop
            animate();
        }

        function setupScene() {
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(30, 50, 30);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 100;

            // Add shadow camera helper (optional)
            // const helper = new THREE.CameraHelper(directionalLight.shadow.camera);
            // scene.add(helper);

            scene.add(directionalLight);
            directionalLight.target.position.set(0, 0, 0);
            scene.add(directionalLight.target);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(500, 500);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x66aa66 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Scene objects
            createFlowers(150);
            createButterflies(15);
            createParticles(500);

            // Post-processing
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            composer.addPass(new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.2,  // strength (increased)
    0.4,  // radius
    0.2   // threshold (lowered)
));

            // Event listeners
            window.addEventListener('resize', onWindowResize);
        }

        function createLoveText() {
            const text = document.createElement('div');
            text.className = 'love-text';
            text.textContent = loveMessages[Math.floor(Math.random() * loveMessages.length)];
            text.style.left = `${Math.random() * 80 + 10}%`;
            text.style.top = `${Math.random() * 50 + 25}%`;
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 8000);
        }

        function createFlowers(count) {
            const stemHeight = 1;
            const petalRadius = 0.5;
            const stemGeo = new THREE.CylinderGeometry(0.05, 0.1, stemHeight, 8);
            const petalGeo = new THREE.SphereGeometry(petalRadius, 16, 8);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x006400 });
            const flowerColors = [0xff69b4, 0xffd700, 0xffa500, 0xadd8e6, 0xdda0dd];

            for (let i = 0; i < count; i++) {
                const flower = new THREE.Group();

                // Stem
                const stem = new THREE.Mesh(stemGeo, stemMat);
                stem.position.y = stemHeight / 2;
                stem.castShadow = true;
                flower.add(stem);

                // Petal
                const petalMat = new THREE.MeshStandardMaterial({
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)],
                    roughness: 0.6
                });
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.position.y = stemHeight + petalRadius * 0.8;
                petal.scale.set(1, 1.2, 1);
                petal.castShadow = true;
                flower.add(petal);

                // Position and scale
                flower.position.set(
                    (Math.random() - 0.5) * 80,
                    0,
                    (Math.random() - 0.5) * 80
                );
                flower.rotation.y = Math.random() * Math.PI * 2;
                const scale = Math.random() * 0.5 + 0.8;
                flower.scale.set(scale, scale, scale);

                // Animation properties
                flower.userData = {
                    swaySpeed: Math.random() * 0.5 + 0.2,
                    swayAmount: (Math.random() - 0.5) * 0.05
                };

                scene.add(flower);
                flowers.push(flower);
            }
        }

        function createButterflies(count) {
            const wingShape = new THREE.Shape()
                .moveTo(0, 0)
                .quadraticCurveTo(1.5, 1.2, 1.8, 0.5)
                .quadraticCurveTo(1.9, 0.0, 1.7, -0.2)
                .quadraticCurveTo(1.2, -0.8, 0, -0.1);

            const wingGeo = new THREE.ShapeGeometry(wingShape);
            wingGeo.center();
            const bodyGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });

            for (let i = 0; i < count; i++) {
                const butterfly = new THREE.Group();
                const wingTexture = createButterflyTexture();
                const wingMat = new THREE.MeshStandardMaterial({
                    map: wingTexture,
                    side: THREE.DoubleSide,
                    roughness: 0.7,
                    metalness: 0.1
                });

                // Body
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.rotation.x = Math.PI / 2;
                body.position.z = -0.5;
                butterfly.add(body);

                // Wings
                const leftWing = new THREE.Mesh(wingGeo, wingMat);
                leftWing.rotation.x = -Math.PI / 2;
                leftWing.rotation.z = Math.PI / 1.5;
                leftWing.castShadow = true;
                butterfly.add(leftWing);

                const rightWing = new THREE.Mesh(wingGeo, wingMat);
                rightWing.rotation.x = -Math.PI / 2;
                rightWing.rotation.z = Math.PI / 4;
                rightWing.castShadow = true;
                butterfly.add(rightWing);

                // Animation properties
                butterfly.userData = {
                    leftWing: leftWing,
                    rightWing: rightWing,
                    flapSpeed: Math.random() * 5 + 2,
                    flightRadius: Math.random() * 15 + 10,
                    flightSpeed: Math.random() * 0.3 + 0.1,
                    flightOffset: Math.random() * Math.PI * 2,
                    altitude: Math.random() * 8 + 5
                };

                butterfly.position.y = butterfly.userData.altitude;
                scene.add(butterfly);
                butterflies.push(butterfly);
            }
        }

        function createButterflyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            // Base color
            ctx.fillStyle = `hsl(${Math.random() * 60 + 180}, 70%, 70%)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Veins
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.lineWidth = Math.random() * 1 + 1;
            ctx.beginPath();
            const baseX = canvas.width * 0.1;
            const baseY = canvas.height * 0.9;
            for (let i = 0; i < 5; i++) {
                ctx.moveTo(baseX, baseY);
                const endX = baseX + (Math.random() - 0.2) * canvas.width * 1.1;
                const endY = baseY - (Math.random() * 0.8 + 0.2) * canvas.height;
                const cpX = baseX + (endX - baseX) * (Math.random() * 0.5 + 0.25);
                const cpY = baseY + (endY - baseY) * (Math.random() * 0.5 + 0.25);
                ctx.quadraticCurveTo(cpX, cpY, endX, endY);
            }
            ctx.stroke();

            // Spots
            ctx.fillStyle = `hsl(${Math.random() * 360}, 80%, 60%)`;
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                const x = canvas.width * (Math.random() * 0.6 + 0.3);
                const y = canvas.height * (Math.random() * 0.6 + 0.1);
                ctx.arc(x, y, canvas.width * (Math.random() * 0.05 + 0.05), 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            return texture;
        }

        function createParticles(count) {
            const positions = [];
            const colors = [];
            const particleColors = [
                new THREE.Color(0xffffff),
                new THREE.Color(0xfff79a),
                new THREE.Color(0xbdeff4)
            ];

            for (let i = 0; i < count; i++) {
                positions.push(
                    (Math.random() - 0.5) * 100,
                    Math.random() * 30 + 2,
                    (Math.random() - 0.5) * 100
                );
                const color = particleColors[Math.floor(Math.random() * particleColors.length)];
                colors.push(color.r, color.g, color.b);
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                sizeAttenuation: true,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Animate butterflies
            butterflies.forEach(butterfly => {
                const flapAngle = Math.sin(elapsedTime * butterfly.userData.flapSpeed) * (Math.PI / 4);
                butterfly.userData.leftWing.rotation.x = -Math.PI / 18 + flapAngle;
                butterfly.userData.rightWing.rotation.x = -Math.PI / 18 + flapAngle;

                const angle = elapsedTime * butterfly.userData.flightSpeed + butterfly.userData.flightOffset;
                butterfly.position.x = Math.cos(angle) * butterfly.userData.flightRadius;
                butterfly.position.z = Math.sin(angle) * butterfly.userData.flightRadius;
                butterfly.position.y = butterfly.userData.altitude + Math.sin(angle * 2) * 2;
                butterfly.rotation.y = -angle + Math.PI / 2;
            });

            // Animate flowers
            flowers.forEach(flower => {
                flower.rotation.z = Math.sin(elapsedTime * flower.userData.swaySpeed) * flower.userData.swayAmount;
                flower.rotation.x = Math.cos(elapsedTime * flower.userData.swaySpeed * 0.7) * flower.userData.swayAmount;
            });

            // Animate particles
            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] += delta * (Math.random() * 0.5 + 0.2);
                    if (positions[i + 1] > 35) {
                        positions[i + 1] = Math.random() * 5;
                        positions[i] = (Math.random() - 0.5) * 100;
                        positions[i + 2] = (Math.random() - 0.5) * 100;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            composer.render(delta);
        }

        init();
    </script>
</body>
</html>
